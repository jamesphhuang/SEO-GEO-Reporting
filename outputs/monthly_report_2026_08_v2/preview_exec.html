          svg.push('<text x="' + (padL + w + (inside ? -8 : 7)).toFixed(1) + '" y="' + (y + barH / 2 + 4).toFixed(1) +
                   '" font-size="11.5" font-weight="600" text-anchor="' + (inside ? 'end' : 'start') +
                   '" fill="' + (inside ? '#fff' : 'var(--muted)') + '">' + esc(label2) + '</text>');
        }
      });
    });

    svg.push('<line x1="' + padL + '" y1="' + (padT + bodyH) + '" x2="' + (W - padR) + '" y2="' + (padT + bodyH) +
             '" stroke="var(--border)" stroke-width="1"/>');
    svg.push('</svg>');
    return svg.join('') + legendHtml(series);
  }


  /* 100%-stacked horizontal bars: the good / needs-improvement / poor split CrUX reports. */
  function stackedBars(cfg) {
    var W = 860, padL = 215, padR = 16, padT = 6, padB = 8;
    var rowH = 30, bodyH = cfg.categories.length * rowH;
    var H = bodyH + padT + padB, plotW = W - padL - padR;
    var svg = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.title || '') + '">'];
    cfg.categories.forEach(function (label, r) {
      var barH = rowH - 12, y = padT + r * rowH + 6, cursor = padL;
      var total = cfg.series.reduce(function (sum, s) { return sum + (num(s.values[r]) ? s.values[r] : 0); }, 0);
      svg.push('<text x="' + (padL - 10) + '" y="' + (y + barH / 2 + 4).toFixed(1) +
               '" fill="var(--muted)" font-size="11.5" text-anchor="end">' + esc(label) + '</text>');
      cfg.series.forEach(function (s, i) {
        var v = num(s.values[r]) ? s.values[r] : 0, w = total ? v / total * plotW : 0;
        if (w <= 0) return;
        svg.push('<rect x="' + cursor.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) +
                 '" height="' + barH + '" fill="' + (s.color || PALETTE[i % 4]) + '"/>');
        if (w > 46) {
          svg.push('<text x="' + (cursor + w / 2).toFixed(1) + '" y="' + (y + barH / 2 + 4).toFixed(1) +
                   '" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">' +
                   (v / total * 100).toFixed(0) + '%</text>');
        }
        cursor += w;
      });
    });
    svg.push('</svg>');
    return svg.join('') + legendHtml(cfg.series);
  }

  /* Line chart for an evenly spaced series, with an optional dashed threshold line. */
  function lineChart(cfg) {
    var n = cfg.labels.length;
    if (!n) return '';
    var W = 860, padL = 66, padR = 18, padT = 14, padB = 38;
    var bodyH = 210, H = bodyH + padT + padB, plotW = W - padL - padR;
    var threshold = cfg.threshold && num(cfg.threshold.value) ? cfg.threshold.value : 0;
    var max = niceMax(cfg.series.reduce(function (m, s) {
      return s.values.reduce(function (x, v) { return num(v) ? Math.max(x, v) : x; }, m);
    }, threshold));
    var xAt = function (i) { return padL + (n > 1 ? plotW * i / (n - 1) : plotW / 2); };
    var yAt = function (v) { return padT + bodyH - (max ? v / max * bodyH : 0); };
    var svg = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.title || '') + '">'];
    for (var t = 0; t <= 4; t++) {
      var gv = max * t / 4, gy = yAt(gv);
      svg.push('<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) +
               '" stroke="var(--grid)" stroke-width="1"/>');
      svg.push('<text x="' + (padL - 9) + '" y="' + (gy + 4).toFixed(1) +
               '" fill="var(--faint)" font-size="11" text-anchor="end">' +
               esc(cfg.axis ? cfg.axis(gv) : int(Math.round(gv))) + '</text>');
    }
    if (threshold && threshold <= max) {
      var ty = yAt(threshold);
      svg.push('<line x1="' + padL + '" y1="' + ty.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + ty.toFixed(1) +
               '" stroke="var(--pos)" stroke-width="1.5" stroke-dasharray="5 4"/>');
      svg.push('<text x="' + (W - padR) + '" y="' + (ty - 6).toFixed(1) +
               '" fill="var(--pos)" font-size="11" text-anchor="end">' + esc(cfg.threshold.label) + '</text>');
    }
    cfg.series.forEach(function (s, i) {
      var color = s.color || PALETTE[i % 4], points = [], last = -1;
      s.values.forEach(function (v, idx) {
        if (!num(v)) return;
        points.push(xAt(idx).toFixed(1) + ',' + yAt(v).toFixed(1));
        last = idx;
      });
      if (!points.length) return;
      svg.push('<polyline fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" points="' +
               points.join(' ') + '"/>');
      svg.push('<circle cx="' + xAt(last).toFixed(1) + '" cy="' + yAt(s.values[last]).toFixed(1) +
               '" r="3.5" fill="' + color + '"/>');
    });
    var step = Math.max(1, Math.ceil(n / 5));
    for (var i = 0; i < n; i += step) {
      svg.push('<text x="' + xAt(i).toFixed(1) + '" y="' + (padT + bodyH + 18) +
               '" fill="var(--faint)" font-size="11" text-anchor="middle">' + esc(cfg.labels[i]) + '</text>');
    }
    svg.push('<line x1="' + padL + '" y1="' + (padT + bodyH) + '" x2="' + (W - padR) + '" y2="' + (padT + bodyH) +
             '" stroke="var(--border)" stroke-width="1"/>');
    svg.push('</svg>');
    return svg.join('') + legendHtml(cfg.series);
  }

  /* Vertical bars on the left scale with a line on the right: a volume and a rate in one
     frame. Both scales start at zero. Zooming the rate axis would turn a 1.5pt band into a
     dramatic slope, and the honest reading of this data is that the rate has been roughly
     flat — so each point carries its own value label instead of borrowing steepness. */
  function comboChart(cfg) {
    var n = cfg.labels.length;
    if (!n) return '';
    var W = 860, padL = 72, padR = 68, padT = 22, padB = 38;
    var bodyH = 210, H = bodyH + padT + padB, plotW = W - padL - padR;
    var barMax = niceMax(cfg.bar.values.reduce(function (m, v) { return num(v) ? Math.max(m, v) : m; }, 0));
    var lineMax = niceMax(cfg.line.values.reduce(function (m, v) { return num(v) ? Math.max(m, v) : m; }, 0));
    var slot = plotW / n, barW = Math.min(56, slot * 0.5);
    var xMid = function (i) { return padL + slot * (i + 0.5); };
    var yBar = function (v) { return padT + bodyH - (barMax ? v / barMax * bodyH : 0); };
    var yLine = function (v) { return padT + bodyH - (lineMax ? v / lineMax * bodyH : 0); };
    var barColor = cfg.bar.color || PALETTE[0], lineColor = cfg.line.color || PALETTE[1];
    var svg = ['<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.title || '') + '">'];

    for (var t = 0; t <= 4; t++) {
      var gy = padT + bodyH - bodyH * t / 4;
      svg.push('<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) +
               '" stroke="var(--grid)" stroke-width="1"/>');
      svg.push('<text x="' + (padL - 9) + '" y="' + (gy + 4).toFixed(1) + '" fill="' + barColor +
               '" font-size="11" text-anchor="end">' + esc(cfg.bar.axis(barMax * t / 4)) + '</text>');
      svg.push('<text x="' + (W - padR + 9) + '" y="' + (gy + 4).toFixed(1) + '" fill="' + lineColor +
               '" font-size="11" text-anchor="start">' + esc(cfg.line.axis(lineMax * t / 4)) + '</text>');
    }

    cfg.bar.values.forEach(function (v, i) {
      if (!num(v)) return;
      var h = Math.max(barMax ? v / barMax * bodyH : 0, v > 0 ? 2 : 0);
      svg.push('<rect x="' + (xMid(i) - barW / 2).toFixed(1) + '" y="' + yBar(v).toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + barColor + '"/>');
      svg.push('<text x="' + xMid(i).toFixed(1) + '" y="' + (yBar(v) - 6).toFixed(1) + '" fill="var(--muted)" ' +
               'font-size="11" text-anchor="middle">' + esc(cfg.bar.value(v)) + '</text>');
    });

    var pts = [];
    cfg.line.values.forEach(function (v, i) { if (num(v)) pts.push(xMid(i).toFixed(1) + ',' + yLine(v).toFixed(1)); });
    if (pts.length > 1) {
      svg.push('<polyline fill="none" stroke="' + lineColor + '" stroke-width="2" stroke-linejoin="round" points="' +
               pts.join(' ') + '"/>');
    }
    cfg.line.values.forEach(function (v, i) {
      if (!num(v)) return;
      svg.push('<circle cx="' + xMid(i).toFixed(1) + '" cy="' + yLine(v).toFixed(1) + '" r="3.5" fill="' + lineColor + '"/>');
      svg.push('<text x="' + xMid(i).toFixed(1) + '" y="' + (yLine(v) - 9).toFixed(1) + '" fill="' + lineColor +
               '" font-size="11" font-weight="600" text-anchor="middle">' + esc(cfg.line.value(v)) + '</text>');
    });

    cfg.labels.forEach(function (label, i) {
      svg.push('<text x="' + xMid(i).toFixed(1) + '" y="' + (padT + bodyH + 18) +
               '" fill="var(--faint)" font-size="11" text-anchor="middle">' + esc(label) + '</text>');
    });
    svg.push('<line x1="' + padL + '" y1="' + (padT + bodyH) + '" x2="' + (W - padR) + '" y2="' + (padT + bodyH) +
             '" stroke="var(--border)" stroke-width="1"/>');
    svg.push('</svg>');
    return svg.join('') + legendHtml([{name: cfg.bar.name, color: barColor}, {name: cfg.line.name, color: lineColor}]);
  }

  function legendHtml(series) {
    return '<div class="legend">' + series.map(function (s, i) {
      return '<span><i style="background:' + (s.color || PALETTE[i % 4]) + '"></i>' + esc(s.name) + '</span>';
    }).join('') + '</div>';
  }

  function panel(title, sub, body) {
    return '<div class="panel"><h3>' + esc(title) + '</h3>' +
           (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + body + '</div>';
  }

  function tableHtml(columns, rows, minWidth) {
    if (!rows.length) return '';
    var head = columns.map(function (c) {
      return '<th' + (c.left ? ' class="l"' : '') + '>' + esc(c.label) + '</th>';
    }).join('');
    var body = rows.map(function (row) {
      return '<tr>' + columns.map(function (c) {
        var out = c.render(row);
        return '<td' + (c.left ? ' class="l"' : '') + (out.cls ? ' class="' + out.cls + '"' : '') + '>' + out.html + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<div class="scroll"><table' + (minWidth ? ' style="min-width:' + minWidth + 'px"' : '') +
           '><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function cell(html, cls) { return {html: html, cls: cls || ''}; }

  /* ---------- human-authored actions ---------- */

  var recommendations = T.Recommendations || [], nextSteps = T.Next_Steps || [];
  var DETAIL_SECTIONS = ['business', 'gsc', 'ga4', 'geo', 'technical'];
  var EXEC_SECTIONS = ['business', 'gsc', 'geo', 'technical'];
  var SECTION_LABEL = {business: '業務成果', gsc: '搜尋表現', ga4: '導流結構', geo: 'GEO 品牌可見度', technical: '技術項目'};

  function trim(v) { return String(v == null ? '' : v).trim(); }

  /* Recommendations own the status. A Next Step naming one shows that status rather than
     its own, so the two hand-edited tabs cannot report different progress for the same
     work. A sourceRef matching nothing still renders — dropping a commitment silently is
     worse than showing it with a broken link — and every break is listed in the notes. */
  function resolveActions() {
    var byId = {}, out = {steps: [], prior: [], recs: [], broken: [], unknown: []};
    recommendations.forEach(function (r) {
      var id = trim(r.id);
      if (id) byId[id] = r;
      if (trim(r.period) !== CUR) return;
      if (DETAIL_SECTIONS.indexOf(trim(r.section)) < 0) out.unknown.push(id || trim(r.text) || '(未命名建議)');
      else out.recs.push(r);
    });
    nextSteps.forEach(function (row) {
      var period = trim(row.period), section = trim(row.section), ref = trim(row.sourceRef);
      var source = ref ? byId[ref] : null;
      if (ref && !source) out.broken.push({period: period, ref: ref, text: trim(row.text)});
      var item = {
        section: section, order: Number(row.order) || 0, text: trim(row.text), sourceRef: ref,
        sourceMissing: !!(ref && !source),
        status: source ? trim(source.status) : trim(row.status),
        statusFrom: source ? 'Recommendations' : 'Next_Steps'
      };
      if (period === CUR) {
        if (EXEC_SECTIONS.indexOf(section) < 0) { out.unknown.push(ref || item.text || '(未命名 Next Step)'); return; }
        out.steps.push(item);
      } else if (period === PREV) {
        out.prior.push(item);
      }
    });
    out.steps.sort(function (a, b) { return a.order - b.order; });
    out.prior.sort(function (a, b) { return a.order - b.order; });
    return out;
  }

  function statusChip(item) {
    if (item.sourceMissing) return '<span class="badge neg">來源遺失</span>';
    if (!item.status) return '';
    var cls = item.status === '完成' ? ' pos' : (item.status === '取消' ? '' : '');
    return '<span class="badge' + cls + '">' + esc(item.status) + '</span>';
  }

  function actionList(items, emptyNote) {
    if (!items.length) return '<p class="sub">' + esc(emptyNote || '') + '</p>';
    return '<ul class="actions">' + items.map(function (a) {
      return '<li><span class="tag">' + esc(SECTION_LABEL[a.section] || a.section) + '</span>' +
             '<span style="flex:1 1 260px">' + esc(a.text) + '</span>' + statusChip(a) +
             (a.sourceRef ? '<span class="ref">' + esc(a.sourceRef) + '</span>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  /* ---------- sections ---------- */

  var sections = [];
  function section(id, label, html) { sections.push({id: id, label: label, html: html}); }

  var biz = (T.Business || [])[0];
  var gscDelta = T.GSC_Delta || [], gscMonthly = T.GSC_Monthly || [];
  var ga4 = T.GA4_Channels || [], geo = T.GEO_Workduo || [];
  var technical = T.Technical_SF || [], sitemaps = T.Sitemaps || [], sources = T.Sources || [];
  var cwvRows = T.CWV || [], cwvTrend = T.CWV_Trend || [], cwvMissing = T.CWV_Missing || [];

  /* Core Web Vitals thresholds and units travel with the rows, so formatting and the
     pass/fail verdict here never hard-code a metric name or a millisecond boundary. */
  function cwvValue(row, value) {
    if (!num(value)) return '—';
    if (row.unit === 'score') return value.toFixed(3);
    if (row.unit === 's') return (value / 1000).toFixed(2) + ' 秒';
    return Math.round(value).toLocaleString('zh-TW') + ' ms';
  }
  function ratingCls(rating) { return rating === '良好' ? 'pos' : (rating === '不佳' ? 'neg' : ''); }

  /* Google assesses each form factor separately and an origin passes only when all three
     vitals are rated good, so the verdict is per origin x form factor, never site-wide. */
  function cwvGroups() {
    var groups = [], index = {};
    cwvRows.forEach(function (r) {
      if (r.group !== 'Core Web Vitals') return;
      var key = r.siteLabel + ' · ' + r.formLabel;
      if (!index[key]) {
        index[key] = {key: key, siteLabel: r.siteLabel, formLabel: r.formLabel, rows: []};
        groups.push(index[key]);
      }
      index[key].rows.push(r);
    });
    groups.forEach(function (g) {
      g.failing = g.rows.filter(function (r) { return r.rating && r.rating !== '良好'; });
      g.verdict = g.rows.length < 3 ? '資料不足' : (g.failing.length ? '未通過' : '通過');
    });
    return groups;
  }

  /* 1. Executive summary — every bullet is derived, not written by hand. */
  (function () {
    var bullets = [];
    if (biz) {
      bullets.push('<li><strong>' + CUR_M + ' 月 Non-paid 名單 ' + int(biz.augActual) + ' 筆，達成率 ' +
        pct(biz.augReach) + '。</strong>目標 ' + int(biz.augTarget) + ' 筆，差距 ' + int(biz.gap) +
        ' 筆；較 ' + PREV_M + ' 月 <span class="' + signCls(biz.momChange) + '">' + delta(biz.momChange) + '</span>。</li>');
    }
    gscDelta.forEach(function (r) {
      bullets.push('<li><strong>' + esc(r.siteLabel) + ' 台灣搜尋曝光 <span class="' + signCls(r.imprChange) + '">' +
        delta(r.imprChange) + '</span>。</strong>點擊 <span class="' + signCls(r.clicksChange) + '">' +
        delta(r.clicksChange) + '</span>，CTR ' + pct(r.ctrJul) + ' → ' + pct(r.ctrAug) +
        '（<span class="' + signCls(r.ctrChangePt) + '">' + point(r.ctrChangePt) + '</span>），平均排名 ' +
        dec(r.posJul) + ' → ' + dec(r.posAug) + '。</li>');
    });
    var organic = ga4.filter(function (r) { return r.channel === 'Organic Search'; });
    var ai = ga4.filter(function (r) { return r.channel === 'AI Assistant'; });
    if (organic.length) {
      bullets.push('<li><strong>GA4 Organic Search 工作階段同步下滑。</strong>' + organic.map(function (r) {
        return esc(r.siteLabel) + ' <span class="' + signCls(r.sessionsChange) + '">' + delta(r.sessionsChange) + '</span>';
      }).join('、') + '。兩個 property 分開計算，未跨站加總。</li>');
    }
    if (ai.length) {
      bullets.push('<li><strong>AI Assistant 導流仍在成長。</strong>' + ai.map(function (r) {
        return esc(r.siteLabel) + ' ' + int(r.sessionsJul) + ' → ' + int(r.sessionsAug) +
          ' 次（<span class="' + signCls(r.sessionsChange) + '">' + delta(r.sessionsChange) + '</span>）';
      }).join('、') + '。基期小，單月變化不足以視為趨勢。</li>');
    }
    var own = geo.filter(function (r) { return String(r.entity).toUpperCase().indexOf('SHOPLINE') === 0; })[0];
    if (own) {
      bullets.push('<li><strong>GEO 品牌可見度下降 ' + point(own.visibilityChangePt) + '。</strong>' +
        esc(own.entity) + ' 每日平均可見度 ' + pct(own.visibilityJul) + ' → ' + pct(own.visibilityAug) +
        '，仍是監測樣本中最高者；同期多數競品亦下滑，屬樣本共同變動而非單一品牌現象。</li>');
    }
    var cwvVerdicts = cwvGroups();
    if (cwvVerdicts.length) {
      var passed = cwvVerdicts.filter(function (g) { return g.verdict === '通過'; });
      var failed = cwvVerdicts.filter(function (g) { return g.verdict === '未通過'; });
      bullets.push('<li><strong>Core Web Vitals ' + passed.length + '／' + cwvVerdicts.length +
        ' 組通過（站點 × 裝置）。</strong>' +
        (failed.length ? failed.map(function (g) {
          return esc(g.key) + ' ' + g.failing.map(function (r) {
            return esc(r.metricShort) + ' ' + cwvValue(r, r.p75) + ' ' + esc(r.rating);
          }).join('、');
        }).join('；') + '。' : '') +
        'CrUX 實際使用者資料，滾動 28 天窗口' + (meta.cwvPeriod ? '（' + esc(meta.cwvPeriod) + '）' : '') +
        '，不是 ' + CUR_M + ' 月單月數值。</li>');
    }
    var highTech = technical.filter(function (r) { return r.severity === '高'; });
    if (highTech.length) {
      bullets.push('<li><strong>技術面有 ' + highTech.length + ' 項高優先度問題。</strong>' +
        highTech.map(function (r) {
          return esc(r.issue) + '（' + esc(r.siteLabel.replace(/^(主站|部落格)\s*/, '')) + ' ' +
            int(r.count) + (num(r.share) ? '、' + pct(r.share) : '') + '）';
        }).join('；') + '。為單一時點快照，描述現況而非月變化。</li>');
    }
    section('summary', '摘要', '<ul class="tight">' + bullets.join('') + '</ul>');
  })();

  /* 2. Business */
  if (biz) {
    var cards =
      '<div class="cards">' +
      '<div class="card"><div class="k">' + CUR_M + ' 月 Non-paid Leads</div><div class="v">' + int(biz.augActual) +
        '</div><div class="s">目標 ' + int(biz.augTarget) + ' 筆</div></div>' +
      '<div class="card"><div class="k">達成率</div><div class="v ' + (biz.augReach >= 1 ? 'pos' : 'neg') + '">' +
        pct(biz.augReach) + '</div><div class="s">差距 ' + int(biz.gap) + ' 筆</div></div>' +
      '<div class="card"><div class="k">較 ' + PREV_M + ' 月</div><div class="v ' + signCls(biz.momChange) + '">' +
        delta(biz.momChange) + '</div><div class="s">' + int(biz.julActual) + ' → ' + int(biz.augActual) + ' 筆</div></div>' +
      '<div class="card"><div class="k">' + PREV_M + ' 月達成率</div><div class="v">' + pct(biz.julReach) +
        '</div><div class="s">' + int(biz.julActual) + ' / ' + int(biz.julTarget) + ' 筆</div></div>' +
      '</div>';
    var chart = groupedBars({
      title: 'Non-paid Leads 目標與實績',
      categories: [PREV_M + ' 月', CUR_M + ' 月'],
      series: [{name: '實績 Actual', values: [biz.julActual, biz.augActual]},
               {name: '目標 Target', values: [biz.julTarget, biz.augTarget], color: 'var(--c2)'}]
    });
    section('business', '業務成果',
      cards +

      (num(biz.sepTarget) ? (CUR_M + 1) + ' 月目標為 ' + int(biz.sepTarget) + ' 筆。' : '') +
      '成功轉換與 SQL 口徑尚未確認，本報表不作轉換成果宣稱。</div>');
  }

  /* 3. GSC */

      panel('頁面', '單位：次', filterable('pagesBody', pages, detailColumns('page', '網址', true), 760)) +
      panel('查詢', '單位：次', filterable('queriesBody', queries, detailColumns('query', '查詢', false), 700)));

                       queriesBody: {rows: queries, columns: detailColumns('query', '查詢', false), min: 700}};
  })();

  /* 8. Sources */
  if (sources.length) {
    section('sources', '來源與方法', '<div class="panel">' + sources.map(function (s) {

  /* 9. Limitations */
  section('limits', '資料限制', '<ul class="tight">' +
    '<li>GSC 與 GA4 <strong>口徑不同</strong>，不能逐筆對帳：GSC 限台灣 WEB 搜尋，GA4 依合約只限制 hostname、涵蓋所有國家。</li>' +

    '<li>GSC 平均排名由每日已四捨五入的排名做曝光加權，<strong>只是近似值</strong>。</li>' +
    '<li>Non-paid Leads 是<strong>全渠道</strong>業務名單，不是 SEO 單一渠道成果；SQL 與成功轉換口徑尚未確認，不作轉換成果宣稱。</li>' +
    '<li>GEO 為每日等權平均，提示題目與平台組成<strong>尚未做固定樣本對齊</strong>。本月為沿用快照，未重抓。</li>' +
    '<li>頁面與查詢僅各站 Top 25，<strong>未取得上月逐筆對照</strong>。</li>' +
    (technical.length
      ? '<li>Screaming Frog 為<strong>單一時點快照</strong>，無 7 月對照，只能描述現況、不能判斷月變化；優先度為人工判定。未納入 Ahrefs。</li>'
      : '<li>本版<strong>未納入</strong> Screaming Frog 技術稽核，亦未納入 Ahrefs。</li>') +
    (cwvRows.length
      ? '<li>Core Web Vitals 為 CrUX <strong>滾動 28 天</strong>窗口' +
        (meta.cwvPeriod ? '（' + esc(meta.cwvPeriod) + '）' : '') +
        '，與本報表月份不一致，不能與 GSC／GA4 的月度數字對帳；為來源網域層級、未分國別，' +
        '且僅含已啟用回報的 Chrome 使用者。</li>'
      : '<li>本版<strong>未納入</strong> Core Web Vitals；CrUX API 需要 Google API key，本專案的 OAuth 憑證不適用。</li>') +
    '</ul>');

  /* ---------- executive view ---------- */

  function execCard(k, v, sub, cls) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + v +
           '</div><div class="s">' + (sub || '') + '</div></div>';
  }

  function pendingValue(text) {
    return '<span style="font-size:16px;font-weight:560;color:var(--faint)">' + esc(text) + '</span>';
  }

  function metricBox(title, rows) {
    return '<div class="card box"><div class="k">' + esc(title) + '</div>' + rows.map(function (r) {
      return '<div class="row"><span>' + esc(r[0]) + '</span><b class="' + (r[2] || '') + '">' + r[1] + '</b></div>';
    }).join('') + '</div>';
  }

  /* Sheets hands booleans through as real booleans, but a hand-typed TRUE arrives as text. */
  function isTrue(v) { return v === true || String(v).trim().toUpperCase() === 'TRUE'; }

  function monthNum(label) { return Number(String(label).replace(/\D/g, '')) || 0; }

  function execSections() {
    var A = resolveActions(), out = [];
    function push(id, label, html) { out.push({id: id, label: label, html: html}); }
    var mainLabel = (gscDelta[0] || {}).siteLabel || '主站 shopline.tw';
    gscDelta.forEach(function (r) { if (String(r.siteLabel).indexOf('主站') === 0) mainLabel = r.siteLabel; });

    /* 01 — the summary IS the Next Steps. Numbers live in the sections below it. */
    var grouped = {};
    A.steps.forEach(function (step) { (grouped[step.section] = grouped[step.section] || []).push(step); });
    var summary = A.steps.length
      ? EXEC_SECTIONS.filter(function (k) { return grouped[k]; })
          .map(function (k) { return actionList(grouped[k], ''); }).join('')
      : '<p class="sub">本期 Next Step 尚未產製。請在活頁簿的 <b>Next_Steps</b> 分頁填入 period ' +
        esc(CUR) + ' 的項目，重新整理本頁即可顯示。</p>';
    if (A.prior.length) {
      summary += '<div class="panel" style="margin-top:18px"><h3>上期項目追蹤（' + esc(PREV) + '）</h3>' +
                 '<p class="sub">進度以 Recommendations 分頁為準。</p>' + actionList(A.prior, '') + '</div>';
    }
    push('summary', '摘要', summary);

    /* 02 — Non-paid Leads in full; its SQL only as far as the maturity rule allows. */
    if (biz) {
      var leads = '<div class="cards">' +
        execCard(CUR_M + ' 月 Non-paid Leads', int(biz.augActual), '目標 ' + int(biz.augTarget) + ' 筆') +
        execCard('達成率', pct(biz.augReach), '差距 ' + int(biz.gap) + ' 筆', biz.augReach >= 1 ? 'pos' : 'neg') +
        execCard('較 ' + PREV_M + ' 月', delta(biz.momChange),
                 int(biz.julActual) + ' → ' + int(biz.augActual) + ' 筆', signCls(biz.momChange)) +
        '</div>';
      var sqlBlock;
      if (biz.sqlStatus !== 'OK') {
        sqlBlock = '<p class="sub">Non-paid Leads SQL：來源未提供。</p>';
      } else if (isTrue(biz.sqlIsMature)) {
        sqlBlock = '<div class="cards">' +
          execCard(CUR_M + ' 月 Non-paid Leads SQL', int(biz.sqlActual), '目標 ' + int(biz.sqlTarget) + ' 筆') +
          execCard('SQL 達成率', pct(biz.sqlReach),
                   '差距 ' + int(biz.sqlTarget - biz.sqlActual) + ' 筆', biz.sqlReach >= 1 ? 'pos' : 'neg') +
          execCard('SQL 較 ' + PREV_M + ' 月', delta(biz.sqlMomChange),
                   int(biz.sqlPrevActual) + ' → ' + int(biz.sqlActual) + ' 筆', signCls(biz.sqlMomChange)) +
          '</div>';
      } else {
        sqlBlock = '<div class="cards">' +
          execCard(CUR_M + ' 月 Non-paid Leads SQL', int(biz.sqlActual), '目標 ' + int(biz.sqlTarget) + ' 筆・累計中') +
          execCard('SQL 達成率', pendingValue('待成熟'), '成熟日 ' + esc(biz.sqlMatureOn)) +
          execCard('SQL 較 ' + PREV_M + ' 月', pendingValue('待成熟'), '名單月未滿 60 天，不作月比') +
          '</div>';
      }
      push('business', '業務成果', leads + sqlBlock +
        '<div class="note">Non-paid Leads 是全渠道業務名單，不是 SEO 單一渠道成果。' +
        (biz.sqlStatus === 'OK' && !isTrue(biz.sqlIsMature)
          ? 'SQL 於 ' + esc(biz.sqlMatureOn) + ' 才成熟，在那之前依資料合約只呈現累計筆數，不呈現達成率與月變化。'
          : '') +
        (biz.sqlSourceStatus === 'SOURCE_NOT_CONFIRMED' ? 'SQL 來源口徑尚待業務負責人確認。' : '') + '</div>');
    }

    /* 03 — two site cards plus six months of the main site's volume against its rate. */
    if (gscDelta.length) {
      var boxes = '<div class="cards">' + gscDelta.map(function (r) {
        return metricBox(r.siteLabel, [
          [CUR_M + ' 月曝光', int(r.imprAug) + ' <span class="' + signCls(r.imprChange) + '">' + delta(r.imprChange) + '</span>'],
          [CUR_M + ' 月點擊', int(r.clicksAug) + ' <span class="' + signCls(r.clicksChange) + '">' + delta(r.clicksChange) + '</span>'],
          ['CTR', pct(r.ctrAug) + ' <span class="' + signCls(r.ctrChangePt) + '">' + point(r.ctrChangePt) + '</span>'],
          ['平均排名', dec(r.posAug) + ' <span class="' + signCls(r.posChange, true) + '">' + point(r.posChange) + '</span>']
        ]);
      }).join('') + '</div>';

      var series = gscMonthly.filter(function (r) { return r.siteLabel === mainLabel; })
        .sort(function (a, b) { return monthNum(a.monthLabel) - monthNum(b.monthLabel); });
      var trend = series.length > 1 ? panel(mainLabel + '｜近半年曝光與 CTR',
        '柱為曝光（左軸），折線為 CTR（右軸）。兩軸皆自零起算：把 CTR 軸放大會把約 1.5 個百分點的區間畫成陡坡，' +
        '因此改為在每個點標出數值。',
        comboChart({
          title: mainLabel + ' 近半年曝光與 CTR',
          labels: series.map(function (r) { return r.monthLabel; }),
          bar: {name: '曝光', values: series.map(function (r) { return r.impressions; }),
                color: 'var(--c1)', axis: function (v) { return int(Math.round(v)); }, value: function (v) { return int(v); }},
          line: {name: 'CTR', values: series.map(function (r) { return r.ctr; }),
                 color: 'var(--c2)', axis: function (v) { return (v * 100).toFixed(1) + '%'; }, value: function (v) { return pct(v); }}
        })) : '';
      push('gsc', '搜尋表現（GSC・台灣 WEB）', boxes + trend +
        (grouped.gsc ? '<div class="panel"><h3>Next Step</h3>' + actionList(grouped.gsc, '') + '</div>' : ''));
    }

    /* 04 — brand visibility, then AI traffic, then the chatgpt-only lead table. */
    var top5 = geo.filter(function (r) { return num(r.visibilityAug) && r.visibilityAug > 0; })
      .sort(function (a, b) { return b.visibilityAug - a.visibilityAug; }).slice(0, 5);
    var geoHtml = '';
    if (top5.length) {
      geoHtml += panel('品牌可見度 Top 5', '括號內為較 ' + PREV_M + ' 月的變化。可見度為 Workduo 每日等權平均。',
        groupedBars({
          title: '品牌可見度 Top 5',
          categories: top5.map(function (r) { return r.entity + '（' + point(r.visibilityChangePt) + '）'; }),
          colors: top5.map(function (r) { return /^SHOPLINE/i.test(String(r.entity)) ? 'var(--c1)' : 'var(--c4)'; }),
          series: [{name: CUR_M + ' 月可見度', values: top5.map(function (r) { return r.visibilityAug; }), color: 'var(--c4)'}],
          axis: function (v) { return (v * 100).toFixed(0) + '%'; },
          value: function (v) { return pct(v); }
        }));
    }
    var aiRows = (T.GA4_Monthly || []).filter(function (r) {
      return r.siteLabel === mainLabel && r.channel === 'AI Assistant';
    }).sort(function (a, b) { return String(a.month).localeCompare(String(b.month)); });
    if (aiRows.length) {
      geoHtml += panel('AI Assistant 導流｜' + mainLabel,
        '柱為工作階段（左軸），折線為相對同月 Organic Search 的比例（右軸）。' +
        '分母 Organic Search 本身正在下滑，比例上升不必然代表 AI 流量成長，須與柱高並看。',
        comboChart({
          title: 'AI Assistant 工作階段與相對 Organic 比例',
          labels: aiRows.map(function (r) { return r.monthLabel; }),
          bar: {name: 'AI Assistant 工作階段', values: aiRows.map(function (r) { return r.sessions; }),
                color: 'var(--c3)', axis: function (v) { return int(Math.round(v)); }, value: function (v) { return int(v); }},
          line: {name: '相對 Organic Search', values: aiRows.map(function (r) { return r.shareOfOrganic; }),
                 color: 'var(--c2)', axis: function (v) { return (v * 100).toFixed(1) + '%'; }, value: function (v) { return pct(v); }}
        }));
    }
    var aiChannel = T.AI_Channel || [];
    if (aiChannel.length) {
      geoHtml += panel('chatgpt.com 名單與 SQL',
        '此表僅涵蓋 chatgpt.com 單一來源，是上方 AI Assistant 渠道的子集，兩者不可互相對帳。',
        tableHtml([
          {label: '月份', left: true, render: function (r) { return cell(esc(r.monthLabel)); }},
          {label: '名單', render: function (r) { return cell(int(r.leads)); }},
          {label: 'SQL', render: function (r) { return cell(int(r.sql)); }},
          {label: 'CVR', render: function (r) { return cell(pct(r.cvr)); }},
          {label: 'SQL 狀態', render: function (r) {
            return isTrue(r.sqlIsMature) ? cell('已成熟') : cell('累計中（' + esc(r.sqlMatureOn) + ' 成熟）', 'muted');
          }}
        ], aiChannel, 520));
    }
    if (geoHtml || grouped.geo) {
      push('geo', 'GEO 品牌可見度（Workduo）', geoHtml +
        (grouped.geo ? '<div class="panel"><h3>Next Step</h3>' + actionList(grouped.geo, '') + '</div>' : ''));
    }

    return out;
  }

  /* Everything the exec view leaves out but a follow-up question would need. Collapsed by
     default so the page stays short; forced open when printing, because a slide pack that
     drops its own caveats is the failure mode this block exists to prevent. */
  function execNotes() {
    var A = resolveActions(), items = [];
    if (meta.businessAsOf) {
      items.push('業務數字為 ' + esc(String(meta.businessAsOf).replace('T', ' ').replace('Z', ' UTC')) +
                 ' 讀取。來源活頁簿會回溯修訂，同一個月份在不同日期讀到的數字可能不同。');
    }
    if (biz && biz.sqlStatus === 'OK' && !isTrue(biz.sqlIsMature)) {
      items.push('Non-paid Leads SQL 的名單月需滿 60 天才成熟（' + esc(biz.sqlMatureOn) +
                 '）。依 data_contract 規定，未成熟期間不呈現達成率、月變化與燈號，僅呈現累計筆數。' +
                 (biz.sqlSourceStatus === 'SOURCE_NOT_CONFIRMED'
                   ? '此外該列來源在 business_actual_mapping 中仍標記為 SOURCE_NOT_CONFIRMED，尚待業務負責人確認口徑。' : ''));
    }
    if (meta.geoSnapshotAt) {
      items.push('GEO 為 ' + esc(String(meta.geoSnapshotAt).replace('T', ' ').replace('Z', ' UTC')) +
                 ' 的 Workduo 快照沿用，本次未重抓。');
    }
    (T.Sources || []).forEach(function (row) {
      if (row.id === 'ga4Monthly' || row.id === 'aiChannel') {
        items.push('<b>' + esc(row.label) + '</b>：' + esc(row.filters));
      }
    });
    A.broken.forEach(function (b) {
      items.push('<b>來源遺失</b>：Next Step「' + esc(b.text) + '」指向的建議編號 ' + esc(b.ref) +
                 ' 在 Recommendations 分頁中找不到，該列的進度無法帶入。');
    });
    if (A.unknown.length) {
      items.push('<b>已略過 ' + A.unknown.length + ' 列</b>：section 欄位不在允許值域內（' +
                 esc(A.unknown.join('、')) + '）。');
    }
    items.push('本頁為總覽版。完整的技術稽核、Core Web Vitals、Sitemap、重點頁面與查詢，以及全部來源與資料限制，見詳細版。');
    return '<details class="notes"><summary>附註與資料限制（' + items.length + ' 項）</summary><ul>' +
           items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></details>';
  }

  /* ---------- recommendations in the detail view (WP8) ---------- */

  var PRIORITY_ORDER = {'高': 0, '中': 1, '低': 2};

  function recList(items) {
    return '<ul class="actions">' + items.map(function (r) {
      return '<li><span class="tag">' + esc(trim(r.priority) || '—') + '</span>' +
             '<span style="flex:1 1 260px">' + esc(trim(r.text)) + '</span>' +
             statusChip({status: trim(r.status)}) +
             (trim(r.id) ? '<span class="ref">' + esc(trim(r.id)) + '</span>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  /* Appended after every section is built rather than threaded through five separate
     builders: the section id already equals the recommendation's section value, so the
     whole mapping lives here and a new section needs no extra wiring. The same array is
     rendered again in the roll-up below — duplicated on screen, not in maintenance. */
  (function () {
    var A = resolveActions();
    var bySection = {};
    A.recs.forEach(function (r) {
      var key = trim(r.section);
      (bySection[key] = bySection[key] || []).push(r);
    });
    Object.keys(bySection).forEach(function (key) {
      bySection[key].sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
    });

    sections.forEach(function (sec) {
      var list = bySection[sec.id];
      if (!list || !list.length) return;
      sec.html += '<div class="panel"><h3>本段建議</h3>' +
                  '<p class="sub">人工判斷，非資料推導。編號可在「優化工作建議彙總」中對照。</p>' +
                  recList(list) + '</div>';
    });

    var all = A.recs.slice().sort(function (a, b) {
      var pa = PRIORITY_ORDER[trim(a.priority)], pb = PRIORITY_ORDER[trim(b.priority)];
      pa = pa === undefined ? 3 : pa;
      pb = pb === undefined ? 3 : pb;
      if (pa !== pb) return pa - pb;
      var sa = DETAIL_SECTIONS.indexOf(trim(a.section)), sb = DETAIL_SECTIONS.indexOf(trim(b.section));
      if (sa !== sb) return sa - sb;
      return (Number(a.order) || 0) - (Number(b.order) || 0);
    });

    var body = all.length
      ? tableHtml([
          {label: '編號', left: true, render: function (r) { return cell(esc(trim(r.id))); }},
          {label: '優先度', render: function (r) { return cell(esc(trim(r.priority) || '—')); }},
          {label: '段落', render: function (r) { return cell(esc(SECTION_LABEL[trim(r.section)] || trim(r.section))); }},
          {label: '建議內容', left: true, render: function (r) { return cell(esc(trim(r.text))); }},
          {label: '證據來源', left: true, render: function (r) { return cell(esc(trim(r.evidenceRef)) || '—'); }},
          {label: '狀態', render: function (r) { return cell(statusChip({status: trim(r.status)}) || '—'); }}
        ], all, 820)
      : '<p class="sub">本期建議尚未產製。請在活頁簿的 <b>Recommendations</b> 分頁填入 period ' +
        esc(CUR) + ' 的項目，重新整理本頁即可顯示。</p>';

    var brokenNote = A.broken.length
      ? '<div class="note">有 ' + A.broken.length + ' 條 Next Step 指向不存在的建議編號（' +
        A.broken.map(function (b) { return esc(b.ref); }).join('、') + '），該列的進度無法帶入。</div>'
      : '';
    var skippedNote = A.unknown.length
      ? '<div class="note">已略過 ' + A.unknown.length + ' 列：section 欄位不在允許值域內（' +
        esc(A.unknown.join('、')) + '）。允許值為 ' + DETAIL_SECTIONS.join('、') + '。</div>'
      : '';

    var rollup = {
      id: 'actions', label: '優化工作建議彙總',
      html: '<p class="lede">以上各段為程式推導的數據敘述，本段起為人工判斷。報告本身不宣稱因果；' +
            '建議與其證據的對應關係記在「證據來源」欄，進度以 Recommendations 分頁為準。</p>' +
            body + brokenNote + skippedNote
    };
    var at = sections.map(function (sec) { return sec.id; }).indexOf('sources');
    if (at < 0) sections.push(rollup);
    else sections.splice(at, 0, rollup);
  })();

  /* ---------- render ---------- */

  /* doGet passes ?view=exec through the payload; anything else renders the full report. */
  var VIEW = String(M.view || 'full') === 'exec' ? 'exec' : 'full';
  var pages = VIEW === 'exec' ? execSections() : sections;

  var chips = [];
  if (VIEW === 'exec') chips.push('總覽版');
  if (meta.periodCurrent) chips.push('期間 ' + meta.periodCurrent + '（對照 ' + meta.periodPrevious + '）');
  if (meta.businessAsOf) chips.push('業務數字取數 ' + String(meta.businessAsOf).replace('T', ' ').replace('Z', ' UTC'));
  if (meta.generatedAt) chips.push('資料擷取 ' + String(meta.generatedAt).replace('T', ' ').replace('Z', ' UTC'));
  if (M.renderedAt) chips.push('本頁產生 ' + M.renderedAt + '（' + M.timeZone + '）');
  chips.push('來源 GSC · GA4 · Workduo · Google Sheets' + (technical.length ? ' · Screaming Frog' : '') +
             (cwvRows.length ? ' · CrUX' : ''));

  document.getElementById('root').innerHTML =
    '<header class="top"><h1>' + esc(meta.reportTitle || 'SEO／GEO 月報') + '</h1>' +
    '<div class="chips">' + chips.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') +
    '</div></header>' +
    '<nav class="toc">' + pages.map(function (s) {
      return '<a href="#' + s.id + '">' + esc(s.label) + '</a>';
    }).join('') + '</nav>' +
    pages.map(function (s, i) {
      return '<section id="' + s.id + '"><h2><span class="n">' + String(i + 1).padStart(2, '0') + '</span>' +
             esc(s.label) + '</h2>' + s.html + '</section>';
    }).join('') +
    (VIEW === 'exec' ? execNotes() : '') +
    '<footer>本頁由試算表資料即時產生；數字全部來自本活頁簿分頁。' +
    (VIEW === 'exec' && M.scriptUrl
      ? ' <a href="' + esc(M.scriptUrl) + '?view=full" target="_blank" rel="noopener">開啟詳細版</a>' : '') +
    (M.workbookUrl ? ' <a href="' + esc(M.workbookUrl) + '" target="_blank" rel="noopener">開啟資料來源活頁簿</a>' : '') +
    '</footer>';

  /* A collapsed block prints as a heading with nothing under it, so open them first. */
  window.addEventListener('beforeprint', function () {
    document.querySelectorAll('details').forEach(function (d) { d.open = true; });
  });

  /* Site filters for the page/query tables. */
  document.querySelectorAll('.toolbar[data-for]').forEach(function (bar) {
    var target = bar.getAttribute('data-for'), spec = (window.__detail || {})[target];
    if (!spec) return;
    bar.addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      bar.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === button));
      });
      var want = button.getAttribute('data-f');
      var rows = want ? spec.rows.filter(function (r) { return r.siteLabel === want; }) : spec.rows;
      document.getElementById(target).innerHTML = tableHtml(spec.columns, rows, spec.min);
    });
  });
})();
</script>
</body></html>
